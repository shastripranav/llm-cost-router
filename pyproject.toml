[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-cost-router"
version = "0.1.0"
description = "Analyze LLM API usage logs, classify query complexity, and generate migration plans with cost savings estimates"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Pranav Shastri" }]
dependencies = [
    "click>=8.1",
    "pandas>=2.0",
    "tiktoken>=0.5",
    "pydantic>=2.0",
    "rich>=13.0",
    "structlog>=23.0",
]

[project.scripts]
llm-router = "llm_cost_router.cli:cli"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.4"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
